<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>요일별 점검 동선 (카카오맵)</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2330">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="점검 동선">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="application-name" content="점검 동선">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--panel:#fff;--fg:#1d2330;--muted:#6a7384;--line:#dfe3ea;--hover:#eef3fb;--accent:#1f5fbf;--ok:#15803d;--okbg:#e2f4e8;--bad:#d42f2f;--badbg:#fdecec;--me:#1a73e8;--pin-ok:#15803d;--pin-bad:#d42f2f;--font:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--panel:#1a1e26;--fg:#e8ebf0;--muted:#9aa3b4;--line:#2b313d;--hover:#232a36;--accent:#6ea2ff;--ok:#3ccf7e;--okbg:#14301f;--bad:#ff6b6b;--badbg:#3a1c1e;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* 상단: 제목 · 점검자 · 메뉴 */
.top{position:relative;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0}
h1{font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 .short{display:none}
.top p{margin:2px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-size:12.5px;white-space:nowrap;max-width:42vw;flex:none}
.who span{overflow:hidden;text-overflow:ellipsis}
.who.unset{color:var(--accent);border-color:var(--accent);font-weight:700}
.sync{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-size:12px;white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)}.sync.wait i{background:#e0a100}.sync.off i{background:var(--bad)}.sync.loc i{background:var(--muted)}
.sync.off{color:var(--bad);border-color:var(--bad)}
.modal .err{color:var(--bad);font-size:12.5px}
.modal .err:empty{display:none}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px;line-height:1;flex:none}
.menu{position:absolute;right:12px;top:calc(100% + 4px);z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:6px;min-width:220px;display:grid}
.menu[hidden]{display:none}
.menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer;font-size:13.5px}
.menu button:hover{background:var(--hover)}
.menu .danger{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .ver{padding:6px 12px 4px;font-size:11.5px;color:var(--muted)}

/* 일차 탭 */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab .dot{width:10px;height:10px;border-radius:50%}
.tab.on{font-weight:700;background:var(--hover);border-color:var(--fg)}
.tab .pg{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.tab .ts{display:none}

/* 주소 목록 (접기/펼치기) */
.sheet{flex:none;height:40%;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-bottom:1px solid var(--line)}
.sheet.closed{height:auto}
.sheet.closed .scroll,.sheet.closed .status{display:none}
.handle{display:flex;align-items:center;gap:10px;padding-right:16px}
/* 진행률 막대: 초록 = 완료, 빨강 = 이상 */
.pbar{display:flex;height:4px;background:var(--line);overflow:hidden;flex:none}
.pbar i{display:block;height:100%;width:0;transition:width .3s}
.pbar .ok{background:var(--pin-ok)}.pbar .ng{background:var(--pin-bad)}
.dpb{margin:0 16px 8px;border-radius:2px}
.pct{font-weight:700;color:var(--fg)}
.tab{position:relative;padding-bottom:10px!important}
.tab .tb{position:absolute;left:12px;right:12px;bottom:4px;height:3px;border-radius:2px}
.tgl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:10px 0 10px 16px;border:0;background:none;cursor:pointer;text-align:left;font-weight:700;font-size:13.5px}
.car{display:inline-block;transition:transform .15s;color:var(--muted);font-size:12px;width:12px;flex:none}
.sheet.closed .tgl .car,.day.fold .car{transform:rotate(-90deg)}
.tgl .lbl{flex:none;white-space:nowrap}
.sum{min-width:0;font-weight:400;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}
.flt{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.scroll{overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain}
.day{border-bottom:1px solid var(--line)}
.dayhead{padding:10px 16px 6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;cursor:pointer;user-select:none}
.dayhead b{font-size:15px}.dayhead .meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.prog{font-size:12px;font-variant-numeric:tabular-nums;margin-left:auto}
.day.fold .body{display:none}
.stops{list-style:none;margin:0;padding:0 0 8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.stop{padding:7px 16px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;cursor:pointer;border-left:3px solid transparent}
.stop:hover{background:var(--hover)}
.stop.sel{background:var(--hover);border-left-color:var(--accent)}
.stop.done .addr{color:var(--muted)}
.hide-done .stop.done{display:none}
.num{position:relative;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.addr{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;margin-left:6px;vertical-align:1px;line-height:18px}
.chip.done{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}
.id{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.last{font-size:11.5px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.last .mm{color:var(--bad)}
.links{display:flex;gap:10px;font-size:12px;margin-top:2px;flex-wrap:wrap}
/* 길안내·로드뷰 버튼 (웹 링크가 아니라 앱/화면을 바로 엶) */
.lk{background:none;border:0;padding:2px 0;font:inherit;font-size:12px;color:var(--accent);cursor:pointer;text-align:left}.lk:hover{text-decoration:underline}
.leg{padding:0 16px 8px 50px;font-size:11.5px;color:var(--muted)}
.status{padding:7px 16px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}

/* 지도 */
.mapwrap{position:relative;flex:1;min-height:0;isolation:isolate}
#map{position:absolute;inset:0;z-index:0}
.pin{position:relative;min-width:26px;height:26px;padding:0 4px;border-radius:13px;color:#fff;font:700 12px var(--font);display:flex;align-items:center;justify-content:center;gap:3px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer;transition:transform .12s;white-space:nowrap}
.pin.done,.pin.bad{padding:0 8px 0 7px}
.pin .pt{font-size:11.5px}
.pin.sel{transform:scale(1.25);box-shadow:0 0 0 2px #fff,0 0 0 4px #1d2330,0 2px 6px rgba(0,0,0,.5)}
.home{white-space:nowrap;padding:3px 7px;border-radius:5px;background:#1d2330;color:#fff;font:700 11px var(--font);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.me{position:relative;width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15),0 1px 4px rgba(0,0,0,.4)}
.me::after{content:"";position:absolute;inset:-10px;border-radius:50%;background:rgba(26,115,232,.3);animation:pulse 2s ease-out infinite;z-index:-1}
@keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.me::after{animation:none;opacity:.5}}
.legend{position:absolute;left:12px;bottom:12px;z-index:10;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.2);line-height:1.9}
.legend b{display:block;font-size:13px;margin-bottom:2px}
.legend .sw{display:inline-block;width:22px;height:5px;border-radius:3px;vertical-align:middle;margin-right:8px}
.legend .row{cursor:pointer}.legend .row:hover{text-decoration:underline}
.legend .stl{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.legend .lk{color:var(--muted);font-size:12px}
.lp{display:inline-block;color:#fff;font:700 11px/18px var(--font);font-style:normal;padding:0 8px;border-radius:9px}
/* 내 위치 버튼: 모서리(Netlify 배지 자리)에서 위로 올려 엄지로 누르기 쉽게 */
.locbtn{position:absolute;right:12px;bottom:84px;z-index:12;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);box-shadow:0 1px 5px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.locbtn.on{color:var(--me)}
.locbtn.wait svg{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 지점 정보창 */
.card{position:absolute;z-index:15;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-height:calc(100% - 16px);overflow-y:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.28);padding:12px 14px;font-size:13px}
.card[hidden]{display:none}
.ch{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start}
.ch .num{margin-top:2px}
.jt{display:block;font-size:15.5px;line-height:1.35;overflow-wrap:anywhere}
.kv{display:flex;align-items:center;gap:4px 8px;margin-top:4px;flex-wrap:wrap;font-size:12.5px}
.cps{display:inline-flex;gap:4px}
.kv .k{color:var(--muted)}
.kv code{font:500 12.5px ui-monospace,Consolas,"D2Coding",monospace;font-variant-numeric:tabular-nums}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--muted)}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:17px;padding:0 2px;line-height:1}
.meta2{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.55;overflow-wrap:anywhere}
/* 상태 표시 + 버튼 + 사유 입력 */
.stbox{margin-top:10px;padding:9px 11px;border-radius:8px;font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.stbox b{font-size:14px}
.stbox.done{background:var(--okbg);border-color:transparent;color:var(--ok)}
.stbox.bad{background:var(--badbg);border-color:transparent;color:var(--bad)}
.stbox .why{margin-top:3px;color:var(--fg);font-size:13px;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;margin-top:8px}
.ab{flex:1;padding:10px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;font-weight:700;font-size:13.5px;white-space:nowrap}
.ab.ok{background:var(--pin-ok);border-color:var(--pin-ok);color:#fff}
.ab.ng{color:var(--bad);border-color:var(--bad)}
.ab.ng.on,.ab.ng.sm{background:var(--pin-bad);border-color:var(--pin-bad);color:#fff}
.ab.neutral.on{border-color:var(--fg);background:var(--hover)}
.ab.sm{flex:none;padding:7px 16px;font-size:13px}
.ab.neutral.sm{background:var(--fg);border-color:var(--fg);color:var(--panel)}
.rform{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.rform label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
.rform.bad label,.rform.edit label{color:var(--bad)}
.rform textarea{width:100%;min-height:52px;resize:vertical;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.rform textarea.need{border-color:var(--bad);box-shadow:0 0 0 2px var(--badbg)}
.rform .row{display:flex;justify-content:flex-end;gap:6px;margin-top:6px;align-items:center}
/* 이력: 시각 · 사용자 - 사유 [구분] */
details.hist{margin-top:8px;font-size:12.5px}
details.hist summary{cursor:pointer;color:var(--muted)}
.hist ol{list-style:none;margin:0;padding:4px 0 0}
.hist li{padding:5px 0;border-top:1px dashed var(--line);overflow-wrap:anywhere}
.lt{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:3px}
.lm.k-done{color:var(--ok);font-weight:700}.lm.k-bad{color:var(--bad)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:999px;line-height:16px;margin-left:4px;vertical-align:1px;background:var(--hover);color:var(--muted)}
.tag.k-bad,.tag.k-edit{background:var(--badbg);color:var(--bad)}
/* 작업 로그 */
.logbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:560px;width:100%;max-height:min(82vh,720px);display:flex;flex-direction:column}
.lhd{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.lhd h2{flex:1;margin:0;font-size:16px}
.lhd select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);max-width:55%}
#logList{list-style:none;margin:0;padding:2px 16px 12px;overflow-y:auto}
#logList li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;cursor:pointer;overflow-wrap:anywhere}
#logList li:hover{background:var(--hover)}
#logList .where{font-size:11.5px;color:var(--muted);margin-top:2px}
#logList .empty{color:var(--muted);cursor:default}
.fl{display:grid;gap:4px;font-size:12.5px;font-weight:700}
.clinks{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px}
.clinks .lk{font-size:12.5px;font-weight:500}
/* 로드뷰 (앱 안에서 바로 보기) */
.rv{position:fixed;inset:0;z-index:55;background:#000;display:flex;flex-direction:column}
.rv[hidden]{display:none}
.rvhd{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:#1d2330;color:#fff}
.rvhd b{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvhd .x{color:#fff;font-size:20px;padding:4px 6px}
.rvbody{position:relative;flex:1;min-height:0}
#rvBox{position:absolute;inset:0}
.rvmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;background:rgba(0,0,0,.6);padding:10px 14px;border-radius:8px;font-size:13.5px;text-align:center;max-width:85%}
.rvmsg:empty{display:none}

/* 키 입력 / 점검자 입력 / 알림 */
.setup{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
.setup[hidden]{display:none}
.setup form,.modal form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:440px;width:100%;display:grid;gap:10px}
.setup h2,.modal h2{margin:0;font-size:16px}.setup p,.modal p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.setup input,.modal input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
.setup button{font:inherit;padding:8px;border-radius:6px;border:0;background:#fee500;color:#191919;font-weight:700;cursor:pointer}
.setup .err{color:#d6456b;font-size:12.5px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.modal .row button{padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.modal .row .pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translate(-50%,-12px);opacity:0;transition:opacity .2s,transform .2s;background:#1d2330;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;z-index:60;pointer-events:none;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:761px){.card{left:12px;right:auto;top:12px;bottom:auto;width:380px;max-height:calc(100% - 24px)}}
@media (max-width:760px){
.top{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
h1{font-size:14px}h1 .full{display:none}h1 .short{display:inline}.top p{display:none}
.tabs{flex-wrap:nowrap;overflow-x:auto;padding:8px 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;white-space:nowrap}.tab .tn{display:none}.tab .ts{display:inline}
.sheet{height:42%}.tgl{padding-left:12px}.handle{padding-right:12px}
.legend{display:none}
.dayhead{padding:10px 12px 6px}.dpb{margin:0 12px 8px}.stop{padding:7px 12px}.leg{padding:0 12px 8px 46px}.status{padding:7px 12px}
.stops{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="ttl"><h1><span class="full">국도 ITS 장애감시장치 · 요일별 점검 동선</span><span class="short">ITS 점검 동선</span></h1><p>상위국(노드) → 링 → 선번(COT→RT1→RT2…) 순서 · 번호는 방문 순서 · ⌂ 상위국 출발·복귀</p></div>
<button class="sync wait" id="syncBtn" type="button" title="공유 상태 (눌러서 지금 동기화)"><i></i>연결 중</button>
<button class="who" id="whoBtn" type="button" title="점검자 변경"></button>
<button class="iconbtn" id="menuBtn" type="button" aria-label="메뉴" aria-haspopup="true">⋯</button>
<div class="menu" id="menu" hidden>
<button type="button" data-m="log">작업 로그 (점검자별)</button>
<hr>
<button type="button" data-m="who">점검자 이름 변경</button>
<button type="button" data-m="csv">점검 기록 CSV 내보내기</button>
<hr>
<button type="button" data-m="key">카카오 API 키 변경</button>
<hr>
<div class="ver" id="verTxt"></div>
</div>
</header>
<div class="tabs" id="tabs"></div>
<section class="sheet" id="sheet">

// ── 점검 기록: 팀 공유 서버(/api/records, Netlify) + 이 기기 캐시 ──

// 이력 한 줄: "시각 사용자 - 사유 [구분]" (완료는 기본 메시지 '완료', 취소 사유가 없으면 사용자만)
function kindOf(e){return e.st==="done"?"done":e.st==="bad"?"bad":e.st===""?"cancel":"edit"}

  return "<span class='lt'>"+fmt(e.at,full)+"</span> <b>"+esc(e.by)+"</b>"+(m?" - <span class='lm k-"+k+"'>"+esc(m)+"</span>":"")+(t?"<span class='tag k-"+k+"'>"+esc(t)+"</span>":"")}

// 서버(netlify/functions/records.mjs)의 applyAction 과 같은 규칙: 같은 id는 한 번만, 상태·메모는 더 나중 시각이 이김, 이력은 시각순
function applyAction(recs,a){
  var r=recs[a.key]||(recs[a.key]={st:"",memo:"",by:"",at:0,stAt:0,memoAt:0,log:[]});
  if(r.log.some(function(e){return e.id===a.id}))return false;
  if(a.st!=null&&a.at>=(r.stAt||0)){r.st=a.st;r.stAt=a.at}
  if(a.memo!=null&&a.at>=(r.memoAt||0)){r.memo=a.memo;r.memoAt=a.at}
  if(a.at>=(r.at||0)){r.at=a.at;r.by=a.by}
  var e={id:a.id,a:a.label,by:a.by,at:a.at},note=a.note||a.memo||"";if(a.st!=null)e.st=a.st;if(note)e.note=note;
  r.log.push(e);r.log.sort(function(x,y){return x.at-y.at});if(r.log.length>100)r.log=r.log.slice(-100);

function rebuild(){REC=JSON.parse(JSON.stringify(BASE.records||{}));OUT.forEach(function(a){if(a.at>=(BASE.resetAt||0))applyAction(REC,a)})}
rebuild();
function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
// f: {st, memo(지점의 현재 이상 사유), note(이 기록의 사유), label}, pre: 기록 직전에 할 일(입력창 닫기 등)
function act(s,f,pre){needWho(function(){
  if(pre)pre();
  var a={id:rid(),key:sk(s),st:f.st==null?null:f.st,memo:f.memo==null?null:f.memo,note:f.note||null,label:f.label,by:who,at:Date.now()};
  OUT.push(a);
  var e={st:a.st==null?undefined:a.st,note:a.note,a:a.label},m=logMsg(e),t=logTag(e);
  toast(ls(OKEY,JSON.stringify(OUT))?who+(m?" - "+m:"")+(t?" ("+t+")":""):"⚠ 저장 실패: 이 브라우저가 저장을 막고 있습니다");
  applyAction(REC,a);refresh(s);syncUI();flush();
})}

// ── 서버 동기화: 내 기록은 바로 업로드, 다른 사람 기록은 20초마다(화면이 켜져 있을 때) 받아옴 ──
var SY={mode:"init",busy:false,last:0,fail:0,t:null};
function apiHeaders(body){return body?{"content-type":"application/json"}:{}}
function call(method,body,q){
  return fetch(API+(q||""),{method:method,headers:apiHeaders(body),body:body?JSON.stringify(body):undefined,cache:"no-store"}).then(function(r){
    var ct=r.headers.get("content-type")||"",e;
    if(r.status===404||r.status===405||r.status===501||ct.indexOf("json")<0){e=new Error("공유 서버 없음");e.kind="local";throw e}
    if(!r.ok){e=new Error("서버 오류 "+r.status);e.kind="server";throw e}
    return r.json()});
}
function setBase(d){
  var before=REC;
  BASE={etag:d.etag||null,records:d.records||{},resetAt:d.resetAt||0};
  if(BASE.resetAt){var n=OUT.length;OUT=OUT.filter(function(a){return a.at>=BASE.resetAt});if(OUT.length!==n)ls(OKEY,JSON.stringify(OUT))}
  ls(BKEY,JSON.stringify(BASE));rebuild();showChanges(before);
}
// 바뀐 지점만 다시 그리고, 다른 점검자의 새 기록은 알림으로 보여줌
function showChanges(before){
  var remote=[];
  each(function(s){var k=sk(s),o=before[k]||null,n=REC[k]||null;
    if(JSON.stringify(o)===JSON.stringify(n))return;
    refresh(s);
    if(SY.last&&n&&n.by&&n.by!==who&&(!o||n.at>(o.at||0)))remote.push(n.by+" · "+(s.di+1)+"일차 "+(s.i+1)+"번 "+ST_TXT[n.st]);
  });
  if(remote.length)toast(remote.length===1?remote[0]:remote[0]+" 외 "+(remote.length-1)+"건");
}
function poll(){
  if(SY.busy||SY.mode==="local")return;
  SY.busy=true;
  call("GET",null,BASE.etag?"?since="+encodeURIComponent(BASE.etag):"").then(function(d){
    SY.busy=false;if(!d.unchanged)setBase(d);ok();if(OUT.length)flush();
  }).catch(fail);
}
function flush(){
  if(SY.busy||!OUT.length||SY.mode==="local")return;
  SY.busy=true;var batch=OUT.slice(0,50),ids={};batch.forEach(function(a){ids[a.id]=1});
  call("POST",{actions:batch}).then(function(d){
    SY.busy=false;OUT=OUT.filter(function(a){return !ids[a.id]});ls(OKEY,JSON.stringify(OUT));setBase(d);ok();if(OUT.length)flush();
  }).catch(fail);
}
function sync(){if(OUT.length)flush();else poll()}
function ok(){SY.mode="shared";SY.last=Date.now();SY.fail=0;syncUI();nameFirst()}
// 이름이 없으면 기록 전에 먼저 받음 (누가 점검했는지 남기기 위해)
function nameFirst(){if(!who&&$("whoDlg").hidden)askWho()}
function fail(e){SY.busy=false;var k=e&&e.kind;
  if(k==="local"){SY.mode="local";syncUI();nameFirst();return}
  SY.mode=k==="server"?"error":"offline";SY.fail++;syncUI();
}
function tick(){clearTimeout(SY.t);if(!document.hidden&&SY.mode!=="local")sync();
  SY.t=setTimeout(tick,SY.fail?Math.min(60000,POLL_MS*Math.pow(2,SY.fail-1)):POLL_MS)}
function syncUI(){
  var b=$("syncBtn"),n=OUT.length,m=SY.mode,t,c,line;
  var last=SY.last?" · "+fmt(SY.last).slice(-5)+" 동기화":"";
  if(m==="shared"){c=n?"wait":"ok";t=n?"올리는 중 "+n:"공유 중";line="팀 공유 저장"+last+(n?" · 올릴 기록 "+n+"건":"")}
  else if(m==="offline"||m==="error"){c="off";t=n?"대기 "+n:"오프라인";line=(m==="error"?"공유 서버 오류":"인터넷 연결 없음")+" · 기록은 이 기기에 저장되고 연결되면 자동으로 올라갑니다"+(n?" (대기 "+n+"건)":"")}
  else if(m==="local"){c="loc";t="이 기기만";line="공유 서버가 없어 이 기기에만 저장됩니다"+(n?" ("+n+"건)":"")}
  else{c="wait";t="연결 중";line="공유 서버 연결 중…"}
  b.className="sync "+c;b.innerHTML="<i></i>"+t;b.title=line;$("syncTxt").textContent=line;
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});
window.addEventListener("online",function(){if(SY.mode==="offline"||SY.mode==="error")SY.mode="init";SY.fail=0;tick()});

var me={pos:null,watch:null,ov:null,circle:null,center:false,follow:0,chk:null},locbtn=$("locbtn");
function distKm(a,b){var R=6371,r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2),y=Math.sin((b.lng-a.lng)*r/2);return 2*R*Math.asin(Math.sqrt(x*x+Math.cos(a.lat*r)*Math.cos(b.lat*r)*y*y))}
function kmTxt(d){return d<1?Math.round(d*1000)+"m":(d<10?d.toFixed(1):Math.round(d))+"km"}
function distTxt(s){return me.pos?" · 현위치에서 "+kmTxt(distKm(me.pos,s)):""}
function accTxt(m){return "±"+(m<1000?Math.round(m)+"m":(m/1000).toFixed(1)+"km")}
// 위치 찾기 속도·정확도 개선:
//  1) 먼저 대략 위치(기지국·와이파이, 1분 이내 값 재사용)를 바로 표시
//  2) 동시에 GPS 정밀 위치를 계속 받아서 더 정확한 값으로 갱신
//  3) 정확한 값이 부정확한 값으로 덮이지 않게 하고, 버튼을 누른 뒤 15초 동안은 정확도가 좋아지면 다시 가운데로
function startGps(center){
  if(!navigator.geolocation){toast("이 기기/브라우저는 위치 기능을 지원하지 않습니다");return}
  if(!window.isSecureContext){toast("위치는 https 주소에서만 사용할 수 있습니다");return}
  if(center){me.center=true;me.follow=Date.now()+15000;
    if(me.pos){me.center=false;centerMe();toast("내 위치 · 정확도 "+accTxt(me.pos.acc))}}
  if(me.watch!==null)return;
  locbtn.classList.add("wait");
  navigator.geolocation.getCurrentPosition(onPos,function(){},{enableHighAccuracy:false,maximumAge:60000,timeout:5000});
  me.watch=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  // 15초가 지나도 오차가 500m보다 크면 '정확한 위치' 설정 안내 (대략적 위치만 허용된 경우가 많음)
  clearTimeout(me.chk);me.chk=setTimeout(function(){if(me.pos&&me.pos.acc>500)toast("위치 오차가 큽니다("+accTxt(me.pos.acc)+") — 휴대폰 설정에서 이 앱(브라우저)의 위치를 '정확한 위치'로 허용하고 GPS를 켜 주세요")},15000);
}
function onPos(p){var c=p.coords,n={lat:c.latitude,lng:c.longitude,acc:c.accuracy||9999,t:p.timestamp||Date.now()},o=me.pos;

  if(o&&n.acc>o.acc*1.5&&n.t-o.t<15000)return;
  var better=!o||n.acc<o.acc/2;
  me.pos=n;locbtn.classList.remove("wait");locbtn.classList.add("on");drawMe();updDist();
  if(me.center||(better&&me.follow&&Date.now()<me.follow)){me.center=false;centerMe()}}
function onPosErr(e){locbtn.classList.remove("wait");
  if(e.code===1){navigator.geolocation.clearWatch(me.watch);me.watch=null;locbtn.classList.remove("on");toast("위치 권한이 꺼져 있습니다 — 브라우저/휴대폰 설정에서 위치를 허용해 주세요")}
  else if(!me.pos)toast(e.code===3?"위치 확인 시간 초과 — 잠시 후 다시 눌러 주세요":"현재 위치를 확인할 수 없습니다")}

    me.ov=new C.CustomOverlay({position:ll,content:el,zIndex:25,clickable:true});me.ov.setMap(map);
    me.circle=new C.Circle({center:ll,radius:r,strokeWeight:1,strokeColor:"#1a73e8",strokeOpacity:.5,fillColor:"#1a73e8",fillOpacity:.1});me.circle.setMap(map)}
  else{me.ov.setPosition(ll);me.circle.setPosition(ll);me.circle.setRadius(r)}}

function updDist(){each(function(s){var e=$("d"+s.di+"_"+s.i);if(e)e.textContent=distTxt(s)});if(cur){var c=$("cdist");if(c)c.textContent=distTxt(DAYS[cur.di].stops[cur.i])}}

// 진행률 = 완료 ÷ 전체 지점. 막대는 초록(완료) + 빨강(이상)

  });
  C.event.addListener(map,"click",function(){closeCard()});
  // 지도 영역 크기가 바뀌면(목록 접기/펼치기, 화면 회전 등) 다시 맞춤. 처음에 크기가 0이었다면 범위도 다시 맞춤.
  var mapEl=$("map"),lastW=mapEl.offsetWidth,lastH=mapEl.offsetHeight;
  fitMap=function(){var w=mapEl.offsetWidth,h=mapEl.offsetHeight;if(w===lastW&&h===lastH)return;var first=!lastH,c=map.getCenter();lastW=w;lastH=h;map.relayout();map.setCenter(c);if(first&&h)show(active);placeLoc()};
  if(window.ResizeObserver)new ResizeObserver(function(){fitMap()}).observe(mapEl);else window.addEventListener("resize",fitMap);
  show(active);
  if(cur)openCard(cur.di,cur.i,"zoom");
  drawMe();
  loadRoutes();
}
function setRoute(D,di,coords,dist,dur,src){
  D.line.setPath(coords.map(function(p){return new kakao.maps.LatLng(p[0],p[1])}));
  D.line.setOptions({strokeStyle:"solid",strokeWeight:5,strokeOpacity:.85});
  D.rt={dist:dist,dur:dur};$("m"+di).textContent=metaTxt(D);
  D.src=src;
}
// 상위국 출발·복귀 거리(⌂ → 1번 … 마지막 → ⌂)도 지점 위치로 다시 계산 — 지점을 바꿔도 자동으로 맞음. 실패하면 저장된 값 유지
function osrmLoop(D,di){
  var b=[D.base[1],D.base[0]],c=[b].concat(D.stops.map(function(s){return[s.lng,s.lat]}),[b]);
  return fetch("https://router.project-osrm.org/route/v1/driving/"+c.map(function(p){return p.join(",")}).join(";")+"?overview=false")
  .then(function(r){return r.json()}).then(function(j){var R=j.routes&&j.routes[0];if(!R||!R.legs||!R.legs.length)throw 0;
    var L=R.legs,first=L[0],last=L[L.length-1];
    D.loop=[R.distance/1000,R.duration/60];D.tail=[last.distance/1000,last.duration/60];if(D.lead)D.lead=[first.distance/1000,first.duration/60];
    $("m"+di).textContent=metaTxt(D);var t=$("tail"+di),l=$("lead"+di);if(t)t.innerHTML=tailTxt(D);if(l&&D.lead)l.innerHTML=leadTxt(D)});
}
function kakaoRoute(D){
  var S=D.stops,body={origin:{x:S[0].lng,y:S[0].lat},destination:{x:S[S.length-1].lng,y:S[S.length-1].lat},waypoints:S.slice(1,-1).map(function(s,i){return{name:"p"+i,x:s.lng,y:s.lat}}),priority:"RECOMMEND"};
  return fetch("https://apis-navi.kakaomobility.com/v1/waypoints/directions",{method:"POST",headers:{"Authorization":"KakaoAK "+restKey,"Content-Type":"application/json"},body:JSON.stringify(body)})
  .then(function(r){return r.json()}).then(function(j){
    var R=j.routes&&j.routes[0];if(!R||R.result_code!==0)throw 0;var pts=[];
    R.sections.forEach(function(sec){sec.roads.forEach(function(rd){for(var k=0;k<rd.vertexes.length;k+=2)pts.push([rd.vertexes[k+1],rd.vertexes[k]])})});
    return{pts:pts,dist:R.summary.distance,dur:R.summary.duration,src:"카카오모빌리티"};});
}
function osrmRoute(D){
  var c=D.stops.map(function(s){return[s.lng,s.lat]});
  return fetch("https://router.project-osrm.org/route/v1/driving/"+c.map(function(p){return p.join(",")}).join(";")+"?overview=full&geometries=geojson")
  .then(function(r){return r.json()}).then(function(j){var R=j.routes&&j.routes[0];if(!R)throw 0;
    return{pts:R.geometry.coordinates.map(function(p){return[p[1],p[0]]}),dist:R.distance,dur:R.duration,src:"OSRM"};});
}
function loadRoutes(){
  st.textContent="도로 경로 불러오는 중…";var done=0,res=[];
  DAYS.forEach(function(D,di){
    (restKey?kakaoRoute(D).catch(function(){return osrmRoute(D)}):osrmRoute(D))
    .then(function(r){setRoute(D,di,r.pts,r.dist,r.dur,r.src);res.push(r.src);return osrmLoop(D,di).catch(function(){})}).catch(function(){})
    .then(function(){if(++done<DAYS.length)return;
      if(!res.length)st.textContent="도로 경로를 불러오지 못해 직선(점선)으로 표시됨";
      else st.textContent="도로 경로: "+res.filter(function(v,i,a){return a.indexOf(v)===i}).join(", ")+" 기준"+(res.length<DAYS.length?" ("+res.length+"/"+DAYS.length+"일, 나머지는 직선)":"")+" · 시간은 참고용";});
  });
}
// ── 로드뷰: 앱 안에서 바로 보기 (가장 가까운 로드뷰 위치에서 이 지점을 바라보고, 지점에 마커 표시) ──
var RVS={tok:null};
function openRoadview(s){
  if(!map||!kakao.maps.Roadview){toast("지도를 불러온 뒤 다시 눌러 주세요");return}
  var C=kakao.maps,pos=new C.LatLng(s.lat,s.lng),box=$("rvBox"),msg=$("rvMsg"),tok={};RVS.tok=tok;
  $("rvTtl").textContent=dayLabel(DAYS[s.di],s.di)+" "+(s.i+1)+"번 · "+jibun(s);
  msg.textContent="로드뷰 찾는 중…";box.innerHTML="";$("rvDlg").hidden=false;
  var rv=new C.Roadview(box),client=new C.RoadviewClient();
  C.event.addListener(rv,"init",function(){if(RVS.tok!==tok)return;msg.textContent="";
    var mk=new C.Marker({position:pos});mk.setMap(rv);
    try{rv.setViewpoint(rv.getProjection().viewpointFromCoords(mk.getPosition(),mk.getAltitude()))}catch(e){}});
  // 100m 안에서 먼저 찾고, 없으면 300m까지 넓혀서 찾음
  function go(id,r){if(RVS.tok!==tok)return;
    if(id){rv.setPanoId(id,pos);return}
    if(r<300){client.getNearestPanoId(pos,300,function(id2){go(id2,300)});return}
    msg.textContent="이 지점 근처(300m 안)에는 로드뷰가 없습니다"}
  client.getNearestPanoId(pos,100,function(id){go(id,100)});
}
function closeRoadview(){RVS.tok=null;$("rvDlg").hidden=true;$("rvBox").innerHTML=""}
$("rvClose").onclick=closeRoadview;
function askKey(msg){
  var s=$("setup");s.hidden=false;$("keyerr").textContent=msg||"";s.querySelector("h2").textContent=msg?"지도를 불러오지 못했습니다 — 카카오 도메인 등록 필요":"카카오맵 API 키 입력";if(msg)$("keyerr").innerHTML=esc(msg)+"<br><br>카카오 개발자 사이트 → 플랫폼 키 → JavaScript 키 → JavaScript SDK 도메인에 <b>"+esc(location.origin)+"</b> 을(를) 그대로 등록하고 몇 분 뒤 새로고침하세요. 키는 다시 입력할 필요 없습니다.";
  $("jsKey").value=jsKey;$("restKey").value=restKey;st.textContent="카카오맵 API 키가 필요합니다";
}
$("keyform").onsubmit=function(e){e.preventDefault();
  ls("kakaoJsKey",$("jsKey").value.trim());ls("kakaoRestKey",$("restKey").value.trim());location.reload();};
renderWho();
$("verTxt").textContent="버전 "+APP_VERSION;
show(-1);
syncUI();tick();
if(!who)askWho(); // 처음 열면 이름부터 (누가 기록했는지 남기기 위해)
// 위치 권한을 이미 허용했다면 바로 내 위치 표시 시작 (처음엔 ◎ 버튼을 눌러 허용)
if(navigator.permissions&&navigator.permissions.query)navigator.permissions.query({name:"geolocation"}).then(function(p){if(p.state==="granted")startGps(false)}).catch(function(){});
// 휴대폰 홈 화면 앱(PWA): 페이지를 저장해 두어 인터넷이 없을 때도 목록은 열리게 함
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(function(){});
function offlineMsg(){if(navigator.onLine!==false)return false;st.textContent="오프라인: 목록만 표시 중 · 지도는 인터넷 연결되면 자동으로 다시 불러옵니다";return true}
window.addEventListener("online",function(){if(!map)location.reload()});
if(!jsKey){askKey();return}
var sc=document.createElement("script");
// libraries=services : 지번 주소로 위치 찾기(부여노드 1번 등)에 필요
sc.src="https://dapi.kakao.com/v2/maps/sdk.js?appkey="+encodeURIComponent(jsKey)+"&libraries=services&autoload=false";
sc.onload=function(){if(!window.kakao||!kakao.maps){askKey("지도 SDK를 불러오지 못했습니다.");return}kakao.maps.load(init)};
// 휴대폰이면 카카오내비 연결용 SDK를 미리 불러 둠 (버튼을 누르면 바로 내비 앱이 열리도록)
if(phone())loadNaviSdk();
sc.onerror=function(){if(offlineMsg())return;askKey("지도를 불러오지 못했습니다. 키가 맞는지, 이 주소("+location.origin+")가 카카오 앱의 Web 플랫폼 도메인에 등록돼 있는지 확인해 주세요.")};
document.head.appendChild(sc);
setTimeout(function(){if(!map&&$("setup").hidden&&!offlineMsg())askKey("지도가 응답하지 않습니다. 키와 등록 도메인("+location.origin+"), 카카오맵 사용 설정(ON)을 확인해 주세요.")},8000);
})();
</script>
